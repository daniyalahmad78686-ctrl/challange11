
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <nav class="navbar bg-white border-bottom">
        <div class="container px-5">
            <a class="navbar-brand fw-bold fs-4 text-black" href="#">
                LAUNCH<span class="text-primary">LAB</span>
            </a>
            <button class="navbar-toggler border-0 shadow-none"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse w-100" id="navbarMenu">
                <ul class="navbar-nav align-items-start mt-3">
                    <li class="nav-item">
                        <a href="#" class="nav-link text-black py-3">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-black py-3">Catalog</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-black py-3">Roadmaps</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-black py-3">Success Stories</a>
                    </li>
                    <li class="nav-item d-flex align-items-center gap-2 mt-2 mb-3">
                        <button class="btn btn-light border rounded-pill position-relative"
                            type="button"
                            data-bs-toggle="offcanvas"
                            data-bs-target="#bagMenu"
                            aria-controls="bagMenu">
                            <i class="bi bi-bag"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                2
                            </span>
                        </button>
                        <button class="btn btn-primary rounded-pill px-4">
                            Sign In
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="bg-light text-secondary text-center py-5">
        Click the bag icon in the navbar to open the offcanvas drawer.
    </div>
    <div class="offcanvas offcanvas-end" tabindex="-1"
        id="bagMenu" aria-labelledby="bagMenuLabel">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold" id="bagMenuLabel">
                Cart Items (2)
            </h5>
            <button type="button" class="btn-close"
                data-bs-dismiss="offcanvas"
                aria-label="Close">
            </button>
        </div>
        <div class="offcanvas-body d-flex flex-column p-3">
            <div class="d-flex align-items-center gap-3 mb-4">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=100&fit=crop"
                    class="rounded-3 object-fit-cover"
                    width="60" height="60" alt="Minimal Chrono Watch">
                <div class="flex-grow-1">
                    <h6 class="mb-1">Minimal Chrono Watch</h6>
                    <small class="text-secondary">
                        Qty: 1 · $119.00
                    </small>
                </div>
                <button class="btn text-danger p-1" type="button"
                    aria-label="Remove watch">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
            <div class="d-flex align-items-center gap-3 mb-4">
                <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=100&fit=crop"
                    class="rounded-3 object-fit-cover"
                    width="60" height="60" alt="Polarized Aviators">
                <div class="flex-grow-1">
                    <h6 class="mb-1">Polarized Aviators</h6>
                    <small class="text-secondary">
                        Qty: 1 · $85.00
                    </small>
                </div>
                <button class="btn text-danger p-1" type="button"
                    aria-label="Remove glasses">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
            <div class="mt-auto">
                <hr>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-secondary">Subtotal</span>
                    <strong>$204.00</strong>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Total</h5>
                    <h5 class="fw-bold mb-0">$204.00</h5>
                </div>
                <button class="btn btn-dark rounded-pill w-100 fw-bold">
                    Proceed to Checkout
                </button>
            </div>
        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
